name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11"]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: 📦 Install UV
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: 📦 Install dependencies
      run: |
        uv sync --extra dev --python ${{ matrix.python-version }}

    - name: 🔍 Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: 🎨 Format check with black
      run: |
        uv run black --check --diff .

    - name: 🧪 Run tests
      run: |
        uv run pytest --cov=. --cov-report=xml --cov-report=html

    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Install UV
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: 📦 Install dependencies
      run: |
        uv sync --extra dev --python 3.11

    - name: 🔒 Security check with bandit
      run: |
        uv run bandit -r . -c pyproject.toml -x tests,.venv,htmlcov,.pytest_cache -f json -o bandit-report.json || true

    - name: 📋 Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: bandit-report.json

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Build Docker image
      run: |
        docker build -t tv-playlist-cleaner .

    - name: 🧪 Test Docker image
      run: |
        # Test that the image can be run
        docker run --rm tv-playlist-cleaner python -c "import cleaner; print('Docker image works')"
        
        # Test curl availability
        docker run --rm tv-playlist-cleaner curl --version
        
        # Test dependencies
        docker run --rm tv-playlist-cleaner python -c "import requests, tqdm; print('Dependencies OK')"

  build:
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Install UV
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: 🏗️ Build package
      run: |
        uv build

    - name: 📤 Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  release:
    runs-on: ubuntu-latest
    needs: [test, security, docker, build]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Install UV
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: 🏗️ Build package
      run: |
        uv build

    - name: 📤 Upload to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true

    - name: 🏷️ Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
